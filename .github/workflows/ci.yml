name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic simulation tests
        run: npm test -- --reporter=dot

      - name: Build
        run: npm run build

      - name: Write review manifest
        env:
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_EVENT: ${{ github.event_name }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          REVIEW_WORKFLOW_SHA: ${{ github.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REVIEW_ARTIFACT_NAME: robobon-dist-${{ github.sha }}
        run: npm run write:review-manifest

      - name: Check the Pages-path artifact
        run: npm run check:build

      - name: Summarize review provenance
        env:
          REVIEW_EVENT: ${{ github.event_name }}
          REVIEW_WORKFLOW_SHA: ${{ github.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REVIEW_ARTIFACT_NAME: robobon-dist-${{ github.sha }}
        run: |
          {
            echo "## Review artifact provenance"
            printf '%s\n' "- event: ${REVIEW_EVENT}"
            printf '%s\n' "- head SHA: \`${REVIEW_HEAD_SHA}\`"
            printf '%s\n' "- base SHA: \`${REVIEW_BASE_SHA}\`"
            printf '%s\n' "- workflow SHA: \`${REVIEW_WORKFLOW_SHA}\`"
            printf '%s\n' "- artifact: \`${REVIEW_ARTIFACT_NAME}\`"
            echo "- base path: \`/robobon/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653
        with:
          name: robobon-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
